<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>萤火虫星空漫游 · 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060d; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    color: #e8f0ff;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  #menu {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
    background: radial-gradient(circle at 50% 28%, #12233f 0%, #060a14 55%, #04060d 100%);
  }
  #menu.hide { display: none; }
  .title {
    font-size: 32px; font-weight: 700; letter-spacing: 4px;
    color: #ffe27a; text-shadow: 0 0 24px rgba(255, 205, 70, .55);
  }
  .sub { font-size: 13px; color: #8fa8c8; letter-spacing: 2px; margin-top: -6px; }
  #pname {
    width: min(280px, 76vw); height: 46px; margin-top: 12px;
    border: 1px solid rgba(255, 208, 80, .45); border-radius: 10px;
    background: rgba(8, 14, 26, .9); color: #fff6cf;
    font-size: 18px; text-align: center; outline: none; letter-spacing: 1px;
  }
  #pname:focus { border-color: rgba(255, 216, 100, .9); box-shadow: 0 0 18px rgba(255, 200, 60, .25); }
  #startBtn {
    width: min(280px, 76vw); height: 48px; margin-top: 4px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #ffe07a, #f0b32a);
    color: #23180a; font-size: 17px; font-weight: 700; letter-spacing: 3px;
  }
  #startBtn:active { transform: translateY(1px); filter: brightness(.95); }
  .tip { font-size: 12px; line-height: 1.9; color: #7d93b3; text-align: center; margin-top: 6px; }
  #scoreList {
    margin-top: 10px; font-size: 12px; color: #93a9c6; text-align: center;
    line-height: 1.8; min-height: 20px;
  }
  #scoreList b { color: #ffe27a; font-weight: 600; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <div class="title">萤火虫星空漫游</div>
  <div class="sub">2D 俯视版 · 50 关</div>
  <input id="pname" maxlength="16" placeholder="输入名字（中英文/数字，可存档）" autocomplete="off" spellcheck="false">
  <button id="startBtn">开始漫游</button>
  <div class="tip">
    手机：左下摇杆拖动即移动<br>
    电脑：WASD / 方向键移动，R 重开
  </div>
  <div id="scoreList"></div>
</div>

<script>
(function () {
  'use strict';

  // ===================== 基础 =====================
  var MAX_LEVEL = 50;
  var SAVE_KEY = 'firefly2d_save_v1';
  var TAU = Math.PI * 2;

  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var t = 0;

  var menuEl = document.getElementById('menu');
  var nameEl = document.getElementById('pname');
  var startBtn = document.getElementById('startBtn');
  var scoreListEl = document.getElementById('scoreList');

  // ===================== 音效（WebAudio 实时合成） =====================
  var AC = null;

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
      return;
    }
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) AC = new Ctor();
    } catch (e) { AC = null; }
  }

  function beep(f0, f1, dur, vol, type) {
    if (!AC) return;
    try {
      var now = AC.currentTime;
      var osc = AC.createOscillator();
      var gain = AC.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(f0, now);
      if (f1 && Math.abs(f1 - f0) > 1) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol || 0.2, now + Math.min(0.03, dur * 0.3));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(AC.destination);
      osc.start(now);
      osc.stop(now + dur + 0.03);
    } catch (e) {}
  }

  function arpeggio(notes) {
    var delay = 0;
    for (var i = 0; i < notes.length; i++) {
      (function (n, d) {
        setTimeout(function () { beep(n, n, 0.16, 0.16); }, d * 1000);
      })(notes[i], delay);
      delay += 0.1;
    }
  }

  var sfx = {
    collect: function () { beep(1250, 2300, 0.13, 0.18); },
    clear: function () { arpeggio([523, 659, 784, 1047]); },
    fail: function () { beep(420, 90, 0.5, 0.24); },
    victory: function () { arpeggio([523, 659, 784, 1047, 1319]); },
    start: function () { beep(440, 660, 0.18, 0.14); },
    input: function () { beep(880, 880, 0.05, 0.06); }
  };

  // ===================== 存档 =====================
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveAll(obj) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function savePlayer() {
    if (!G.name) return;
    var all = loadAll();
    all[G.name] = { level: G.level, gold: G.gold, time: Math.round(G.totalTime) };
    saveAll(all);
  }
  function renderScoreList() {
    var all = loadAll();
    var names = Object.keys(all);
    if (!names.length) { scoreListEl.innerHTML = ''; return; }
    var html = '已有存档：<br>';
    for (var i = 0; i < Math.min(4, names.length); i++) {
      var k = names[i];
      html += '<b>' + k + '</b> 第 ' + all[k].level + ' 关 · ' + all[k].gold + ' 金币<br>';
    }
    scoreListEl.innerHTML = html;
  }

  // ===================== 关卡参数 =====================
  function levelConfig(L) {
    var n = Math.floor(3 + (L - 1) * 25 / (MAX_LEVEL - 1));
    var radius = 10 + (L - 1) * 0.55;
    var timeLimit = 55 + 4.3 * n;
    var drift = L <= 8 ? 0 : Math.min(2.6, (L - 8) * 0.065);
    var size = 0.55 - 0.20 * (L - 1) / (MAX_LEVEL - 1);
    return { n: n, radius: radius, time: timeLimit, drift: drift, size: size };
  }

  // ===================== 游戏状态 =====================
  var G = {
    mode: 'menu',          // menu / playing / cleared / failed / victory
    name: '',
    level: 1,
    gold: 0,
    totalTime: 0,
    timeLeft: 60,
    timeLimit: 60,
    timer: 0,
    failText: '',
    collected: 0,
    total: 0
  };

  var P = { x: 0, y: 0, vx: 0, vy: 0, glow: 0 };
  var trail = [];

  var particles = [];       // 金粒子
  var rocks = [];           // 陨石
  var bursts = [];          // 收集爆散

  var levelRadius = 10;
  var driftAmp = 0;
  var goldSize = 0.5;
  var radarRange = 20;

  var cam = { x: 0, y: 0 };
  var scale = 20;
  var viewRadius = 12;

  // ===================== 星空背景 =====================
  var stars = [];
  (function () {
    for (var i = 0; i < 240; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        s: 0.4 + Math.random() * 1.7,
        a: 0.25 + Math.random() * 0.65,
        f: 0.4 + Math.random() * 2.2
      });
    }
  })();

  // ===================== 布局 =====================
  var ui = {
    joy: { x: 0, y: 0, r: 56, mx: 0, my: 0, hx: 0, hy: 0, active: false },
    radar: { x: 0, y: 0, r: 70 }
  };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(cv.clientWidth) || window.innerWidth;
    H = Math.floor(cv.clientHeight) || window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var u = Math.min(1.15, Math.max(0.82, Math.min(W, H) / 420));
    ui.joy.r = 58 * u;
    ui.joy.x = 22 + ui.joy.r;
    ui.joy.y = H - 26 - ui.joy.r;

    ui.radar.r = Math.max(46, Math.min(66, Math.min(W, H) * 0.16));
    ui.radar.x = W - 14 - ui.radar.r;
    ui.radar.y = 62 + ui.radar.r;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  // ===================== 输入 =====================
  var keys = {};
  var pointers = {};   // id -> {role}
  var keyMoveX = 0, keyMoveY = 0;

  function dist2(x1, y1, x2, y2) {
    var dx = x1 - x2, dy = y1 - y2;
    return dx * dx + dy * dy;
  }

  function inCircle(x, y, c, extra) {
    var r = c.r + (extra || 0);
    return dist2(x, y, c.x, c.y) <= r * r;
  }

  function setJoy(x, y) {
    var dx = x - ui.joy.x;
    var dy = y - ui.joy.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var maxLen = ui.joy.r;
    if (len > maxLen) {
      dx = dx / len * maxLen;
      dy = dy / len * maxLen;
      len = maxLen;
    }
    ui.joy.hx = dx;
    ui.joy.hy = dy;
    var nx = dx / maxLen;
    var ny = dy / maxLen;
    var mag = Math.sqrt(nx * nx + ny * ny);
    if (mag < 0.14) { nx = 0; ny = 0; }
    ui.joy.mx = nx;
    ui.joy.my = ny;
  }

  function pointerDown(id, x, y) {
    if (G.mode === 'menu') return;
    if (x < W * 0.52 && y > H * 0.36) {
      pointers[id] = 'joy';
      ui.joy.active = true;
      setJoy(x, y);
      return;
    }
    pointers[id] = 'none';
  }

  function pointerMove(id, x, y) {
    var role = pointers[id];
    if (role === 'joy') setJoy(x, y);
  }

  function pointerUp(id) {
    if (pointers[id] === 'joy') {
      ui.joy.active = false;
      ui.joy.mx = 0;
      ui.joy.my = 0;
      ui.joy.hx = 0;
      ui.joy.hy = 0;
    }
    delete pointers[id];
  }

  cv.addEventListener('touchstart', function (e) {
    e.preventDefault();
    initAudio();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var tc = e.changedTouches[i];
      pointerDown('t' + tc.identifier, tc.clientX, tc.clientY);
    }
  }, { passive: false });

  cv.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var tc = e.changedTouches[i];
      pointerMove('t' + tc.identifier, tc.clientX, tc.clientY);
    }
  }, { passive: false });

  function touchEnd(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      pointerUp('t' + e.changedTouches[i].identifier);
    }
  }
  cv.addEventListener('touchend', touchEnd, { passive: false });
  cv.addEventListener('touchcancel', touchEnd, { passive: false });

  // 鼠标（桌面调试用）
  var mouseDown = false;
  cv.addEventListener('mousedown', function (e) {
    initAudio();
    mouseDown = true;
    pointerDown('m', e.clientX, e.clientY);
  });
  cv.addEventListener('mousemove', function (e) {
    if (mouseDown) pointerMove('m', e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function () {
    if (mouseDown) pointerUp('m');
    mouseDown = false;
  });

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'r' && G.mode !== 'menu') { startLevel(G.level, true); }
    if (k === ' ' || k === 'arrowup' || k === 'arrowdown') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  function readKeyboard() {
    var mx = 0, my = 0;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    var len = Math.hypot(mx, my);
    if (len > 1) { mx /= len; my /= len; }
    keyMoveX = mx;
    keyMoveY = my;
  }

  // ===================== 关卡 =====================
  function startLevel(L, withIntro) {
    var cfg = levelConfig(L);
    G.level = L;
    G.mode = 'playing';
    G.timer = 0;
    G.failText = '';
    G.timeLimit = cfg.time;
    G.timeLeft = cfg.time;
    G.total = cfg.n;
    G.collected = 0;

    levelRadius = cfg.radius;
    driftAmp = cfg.drift;
    goldSize = cfg.size;

    P.x = 0; P.y = 0;
    P.vx = 0; P.vy = 0;
    P.glow = 0;
    trail = [];

    cam.x = 0; cam.y = 0;
    viewRadius = Math.max(levelRadius * 1.15, 11);
    radarRange = levelRadius * 1.2;

    // 金粒子
    particles = [];
    for (var i = 0; i < cfg.n; i++) {
      var u = Math.random();
      var rr = levelRadius * Math.cbrt(u);
      if (Math.random() < 0.35) rr *= 0.45;
      var ang = Math.random() * TAU;
      particles.push({
        bx: rr * Math.cos(ang),
        by: rr * Math.sin(ang),
        x: 0, y: 0,
        ph: Math.random() * TAU,
        f: 0.3 + Math.random() * 0.6,
        alive: true
      });
    }

    // 陨石：第 L 关 L-1 颗，最多 27
    rocks = [];
    var rockCount = Math.min(27, L - 1);
    for (var j = 0; j < rockCount; j++) {
      var rRad = 0.9 + Math.random() * (1.0 + L * 0.03);
      var rx = 0, ry = 0;
      for (var attempt = 0; attempt < 60; attempt++) {
        var ra = Math.random() * TAU;
        var rd = levelRadius * Math.cbrt(Math.random()) * 1.05;
        rx = rd * Math.cos(ra);
        ry = rd * Math.sin(ra);
        if (Math.hypot(rx, ry) > 5.5 + rRad) break;
      }
      var shape = [];
      for (var k = 0; k < 7; k++) shape.push(0.72 + Math.random() * 0.42);
      rocks.push({ x: rx, y: ry, r: rRad, a: Math.random() * TAU, shape: shape });
    }

    bursts = [];
    if (withIntro) sfx.start();
  }

  // ===================== 更新 =====================
  var SPEED = 8.5;
  var COLLECT_R = 1.5;

  function update(dt) {
    readKeyboard();

    // 时间推进
    if (G.mode === 'playing') {
      G.timeLeft -= dt;
      G.totalTime += dt;
      if (G.timeLeft <= 0) {
        G.timeLeft = 0;
        G.mode = 'failed';
        G.timer = 2.0;
        G.failText = '时间到';
        sfx.fail();
        return;
      }
    }

    // 输入合成：摇杆优先，否则键盘
    var mvx = ui.joy.mx !== 0 || ui.joy.my !== 0 ? ui.joy.mx : keyMoveX;
    var mvy = ui.joy.mx !== 0 || ui.joy.my !== 0 ? ui.joy.my : keyMoveY;

    var tvx = mvx * SPEED;
    var tvy = mvy * SPEED;
    var k = 1 - Math.exp(-5.0 * dt);
    P.vx += (tvx - P.vx) * k;
    P.vy += (tvy - P.vy) * k;

    P.x += P.vx * dt;
    P.y += P.vy * dt;

    // 边界：软夹回
    var pr = Math.hypot(P.x, P.y);
    var maxR = levelRadius * 1.22;
    if (pr > maxR) {
      var s = maxR / pr;
      P.x *= s;
      P.y *= s;
      P.vx *= 0.6;
      P.vy *= 0.6;
    }

    // 拖尾
    trail.push({ x: P.x, y: P.y });
    if (trail.length > 16) trail.shift();

    // 金粒子漂移 + 吸附 + 收集
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.alive) continue;
      p.x = p.bx + Math.sin(t * p.f + p.ph) * driftAmp * 2.2;
      p.y = p.by + Math.cos(t * p.f * 0.8 + p.ph * 1.3) * driftAmp * 2.2;

      if (G.mode !== 'playing') continue;

      var dx = p.x - P.x;
      var dy = p.y - P.y;
      var d = Math.hypot(dx, dy);

      // 靠近时轻微吸附
      if (d < 3.0 && d > 0.2) {
        var pull = dt * 1.8;
        p.bx -= dx * pull;
        p.by -= dy * pull;
        p.x -= dx * pull;
        p.y -= dy * pull;
      }

      if (d < COLLECT_R) {
        p.alive = false;
        G.collected++;
        G.gold++;
        spawnBurst(p.x, p.y);
        sfx.collect();
        P.glow = 1;
      }
    }

    // 陨石碰撞
    if (G.mode === 'playing') {
      for (var j = 0; j < rocks.length; j++) {
        var rk = rocks[j];
        if (Math.hypot(rk.x - P.x, rk.y - P.y) < rk.r * 0.9 + 0.9) {
          G.mode = 'failed';
          G.timer = 2.0;
          G.failText = '撞上陨石';
          sfx.fail();
          return;
        }
      }
    }

    // 收满了
    if (G.mode === 'playing' && G.collected >= G.total) {
      G.mode = 'cleared';
      G.timer = 2.0;
      sfx.clear();
      if (G.level >= MAX_LEVEL) {
        G.mode = 'victory';
        G.timer = 0;
        sfx.victory();
      }
      savePlayer();
    }

    if (G.mode === 'cleared') {
      G.timer -= dt;
      if (G.timer <= 0) startLevel(Math.min(MAX_LEVEL, G.level + 1), true);
    } else if (G.mode === 'failed') {
      G.timer -= dt;
      if (G.timer <= 0) startLevel(G.level, true);
    }

    // 爆散粒子
    for (var b = bursts.length - 1; b >= 0; b--) {
      var bp = bursts[b];
      bp.life -= dt;
      bp.x += bp.vx * dt;
      bp.y += bp.vy * dt;
      bp.vx *= 0.96;
      bp.vy *= 0.96;
      if (bp.life <= 0) bursts.splice(b, 1);
    }

    P.glow = Math.max(0, P.glow - dt * 3.0);

    // 相机平滑
    var ck = 1 - Math.exp(-9.0 * dt);
    cam.x += (P.x - cam.x) * ck;
    cam.y += (P.y - cam.y) * ck;

    viewRadius = Math.max(levelRadius * 1.15, 11);
    scale = Math.min(W, H) / (viewRadius * 2);

    // 雷达范围平滑
    var maxDist = levelRadius * 0.6;
    for (var m = 0; m < particles.length; m++) {
      if (particles[m].alive) {
        maxDist = Math.max(maxDist, Math.hypot(particles[m].x - P.x, particles[m].y - P.y));
      }
    }
    for (var m2 = 0; m2 < rocks.length; m2++) {
      maxDist = Math.max(maxDist, Math.hypot(rocks[m2].x - P.x, rocks[m2].y - P.y));
    }
    var targetRange = Math.max(maxDist * 1.12, 8);
    radarRange += (targetRange - radarRange) * (1 - Math.exp(-3.2 * dt));
  }

  function spawnBurst(x, y) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * TAU;
      var sp = 1.2 + Math.random() * 4.5;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.45 + Math.random() * 0.5,
        maxLife: 0.95,
        r: 1.2 + Math.random() * 2.2
      });
    }
  }

  // ===================== 坐标变换 =====================
  function w2s(x, y) {
    return [(x - cam.x) * scale + W * 0.5, (y - cam.y) * scale + H * 0.5];
  }

  // ===================== 绘制工具 =====================
  function fs(base) {
    return base * Math.min(1.12, Math.max(0.86, Math.min(W, H) / 420));
  }

  function txt(str, x, y, size, color, align, weight) {
    ctx.font = (weight || 500) + ' ' + size + 'px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function txtShadow(str, x, y, size, color, align, weight) {
    ctx.font = (weight || 600) + ' ' + size + 'px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function fmtTime(sec) {
    var s = Math.max(0, Math.ceil(sec));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' + r : r);
  }

  // ===================== 渲染 =====================
  function render() {
    // 背景
    var bg = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.85);
    bg.addColorStop(0, '#0c1a30');
    bg.addColorStop(0.55, '#060b16');
    bg.addColorStop(1, '#03050a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStars();

    if (G.mode === 'menu') {
      drawMenuBackdrop();
      return;
    }

    drawBoundary();
    drawRocks();
    drawParticles();
    drawBursts();
    drawPlayer();
    drawHUD();
    drawRadar();
    drawControls();
    drawStateText();
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var px = (st.x * W - cam.x * 9) % W;
      var py = (st.y * H - cam.y * 9) % H;
      if (px < 0) px += W;
      if (py < 0) py += H;
      var tw = 0.62 + 0.38 * Math.sin(t * st.f + st.x * 24);
      ctx.globalAlpha = st.a * tw;
      ctx.fillStyle = i % 9 === 0 ? '#ffeec2' : '#cfe3ff';
      ctx.beginPath();
      ctx.arc(px, py, st.s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMenuBackdrop() {
    // 菜单是 DOM，这里只补一层柔光
    var g = ctx.createRadialGradient(W * 0.5, H * 0.28, 0, W * 0.5, H * 0.28, Math.min(W, H) * 0.7);
    g.addColorStop(0, 'rgba(60,100,170,0.18)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBoundary() {
    var c = w2s(0, 0);
    var r = levelRadius * scale;
    ctx.beginPath();
    ctx.arc(c[0], c[1], r, 0, TAU);
    ctx.strokeStyle = 'rgba(90,140,200,0.18)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([8, 12]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRocks() {
    for (var i = 0; i < rocks.length; i++) {
      var rk = rocks[i];
      var sp = w2s(rk.x, rk.y);
      var rad = rk.r * scale;
      ctx.beginPath();
      for (var k = 0; k < rk.shape.length; k++) {
        var a = rk.a + k * TAU / rk.shape.length;
        var rr = rad * rk.shape[k];
        var x = sp[0] + Math.cos(a) * rr;
        var y = sp[1] + Math.sin(a) * rr;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#4a3c31';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#241c14';
      ctx.stroke();

      // 一点高光
      ctx.beginPath();
      ctx.arc(sp[0] - rad * 0.25, sp[1] - rad * 0.28, rad * 0.22, 0, TAU);
      ctx.fillStyle = 'rgba(150,135,110,0.28)';
      ctx.fill();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.alive) continue;
      var sp = w2s(p.x, p.y);
      if (sp[0] < -60 || sp[0] > W + 60 || sp[1] < -60 || sp[1] > H + 60) continue;

      var col = '255,214,62';

      var r = Math.max(2.6, (goldSize + 0.18) * scale * 0.95);
      var pulse = 1 + 0.12 * Math.sin(t * 3 + p.ph);

      // 光晕
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], r * 2.8 * pulse, 0, TAU);
      ctx.fillStyle = 'rgba(' + col + ',0.13)';
      ctx.fill();

      // 本体
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], r * pulse, 0, TAU);
      ctx.fillStyle = 'rgba(' + col + ',0.95)';
      ctx.fill();

      // 高光点
      ctx.beginPath();
      ctx.arc(sp[0] - r * 0.3, sp[1] - r * 0.35, r * 0.38, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,240,0.95)';
      ctx.fill();

    }
  }

  function drawBursts() {
    for (var i = 0; i < bursts.length; i++) {
      var b = bursts[i];
      var sp = w2s(b.x, b.y);
      var a = Math.max(0, b.life / b.maxLife);
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], b.r * (1 + (1 - a) * 0.8), 0, TAU);
      ctx.fillStyle = 'rgba(255,225,120,' + (a * 0.85) + ')';
      ctx.fill();
    }
  }

  function drawPlayer() {
    // 拖尾
    for (var i = 0; i < trail.length; i++) {
      var ratio = i / trail.length;
      var sp = w2s(trail[i].x, trail[i].y);
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], 1.2 + ratio * 3.2, 0, TAU);
      ctx.fillStyle = 'rgba(255,215,110,' + (ratio * 0.22) + ')';
      ctx.fill();
    }

    var sp = w2s(P.x, P.y);
    var r = Math.max(6, 0.55 * scale);
    var glowR = r * (3.2 + P.glow * 1.8);

    var g = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], glowR);
    g.addColorStop(0, 'rgba(255,232,140,0.55)');
    g.addColorStop(0.35, 'rgba(255,200,70,0.28)');
    g.addColorStop(1, 'rgba(255,190,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sp[0], sp[1], glowR, 0, TAU);
    ctx.fill();

    // 身体
    ctx.beginPath();
    ctx.arc(sp[0], sp[1], r, 0, TAU);
    ctx.fillStyle = '#fff2bd';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sp[0], sp[1], r * 0.55, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // 朝向 / 速度指示
    var spd = Math.hypot(P.vx, P.vy);
    if (spd > 0.4) {
      var ang = Math.atan2(P.vy, P.vx);
      ctx.beginPath();
      ctx.moveTo(sp[0] + Math.cos(ang) * (r + 6), sp[1] + Math.sin(ang) * (r + 6));
      ctx.lineTo(sp[0] + Math.cos(ang + 2.5) * (r + 1), sp[1] + Math.sin(ang + 2.5) * (r + 1));
      ctx.lineTo(sp[0] + Math.cos(ang - 2.5) * (r + 1), sp[1] + Math.sin(ang - 2.5) * (r + 1));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,240,170,0.6)';
      ctx.fill();
    }
  }

  function drawHUD() {
    var pad = 14;

    // 顶部信息条
    txtShadow('第 ' + G.level + ' / ' + MAX_LEVEL + ' 关', pad, 26, fs(15), '#ffe27a', 'left', 700);
    txtShadow('金币 ' + G.gold, pad, 48, fs(12), '#9fc4ff', 'left', 500);

    // 收集进度
    var done = Math.min(G.collected, G.total);
    txtShadow('收集 ' + done + ' / ' + G.total, W * 0.5, 26, fs(14), '#dfeaff', 'center', 600);

    // 时间
    var tcol = G.timeLeft > 15 ? '#8ef0b0' : '#ff6a58';
    txtShadow(fmtTime(G.timeLeft), W - ui.radar.r * 2 - 14 - 8, 26, fs(15), tcol, 'right', 700);

    // 进度条
    var barW = Math.min(200, W * 0.4);
    var barX = W * 0.5 - barW * 0.5;
    var barY = 44;
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.fillRect(barX, barY, barW, 5);
    if (G.total > 0) {
      var frac = done / G.total;
      ctx.fillStyle = 'rgba(255,214,70,0.95)';
      ctx.fillRect(barX, barY, barW * frac, 5);
    }
  }

  function drawRadar() {
    var cx = ui.radar.x;
    var cy = ui.radar.y;
    var R = ui.radar.r;

    // 底板
    ctx.beginPath();
    ctx.arc(cx, cy, R + 6, 0, TAU);
    ctx.fillStyle = 'rgba(6,10,20,0.72)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,215,80,0.35)';
    ctx.stroke();

    // 内圈
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.fillStyle = 'rgba(3,7,14,0.55)';
    ctx.fill();

    ctx.strokeStyle = 'rgba(110,160,220,0.22)';
    for (var ring = 1; ring <= 3; ring++) {
      ctx.beginPath();
      ctx.arc(cx, cy, R * ring / 3, 0, TAU);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
    ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
    ctx.stroke();

    var rr = Math.max(radarRange, 1);
    var sc = R / rr;

    // 陨石
    for (var i = 0; i < rocks.length; i++) {
      var rk = rocks[i];
      var dx = rk.x - P.x;
      var dy = rk.y - P.y;
      var d = Math.hypot(dx, dy);
      var px = cx + dx * sc;
      var py = cy + dy * sc;
      if (d * sc > R - 5) {
        var kk = (R - 5) / (d * sc);
        px = cx + (px - cx) * kk;
        py = cy + (py - cy) * kk;
      }
      var rad = Math.max(3, Math.min(9, rk.r * 2.2));
      ctx.beginPath();
      for (var k2 = 0; k2 < 6; k2++) {
        var aa = k2 * TAU / 6 + i * 0.4;
        var vx = px + Math.cos(aa) * rad;
        var vy = py + Math.sin(aa) * rad * 0.9;
        if (k2 === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(220,70,45,0.92)';
      ctx.fill();
    }

    // 金粒子
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      if (!p.alive) continue;
      var pdx = p.x - P.x;
      var pdy = p.y - P.y;
      var pd = Math.hypot(pdx, pdy);
      var qx = cx + pdx * sc;
      var qy = cy + pdy * sc;
      if (pd * sc > R - 6) {
        var k3 = (R - 6) / (pd * sc);
        qx = cx + (qx - cx) * k3;
        qy = cy + (qy - cy) * k3;
      }

      ctx.beginPath();
      ctx.arc(qx, qy, 3.4, 0, TAU);
      ctx.fillStyle = 'rgba(255,212,60,0.96)';
      ctx.fill();
    }

    // 中心 = 玩家
    ctx.beginPath();
    ctx.arc(cx, cy, 4.2, 0, TAU);
    ctx.fillStyle = 'rgba(120,220,255,0.9)';
    ctx.fill();

    // 标题与范围
    txt('雷达', cx, cy - R - 8, fs(10), 'rgba(255,215,110,0.85)', 'center', 600);
    txt('范围 ' + rr.toFixed(0) + ' m', cx, cy + R + 12, fs(9.5), 'rgba(150,180,220,0.75)', 'center', 500);
  }

  function drawControls() {
    // 摇杆
    ctx.beginPath();
    ctx.arc(ui.joy.x, ui.joy.y, ui.joy.r, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    var hx = ui.joy.x + ui.joy.hx;
    var hy = ui.joy.y + ui.joy.hy;
    ctx.beginPath();
    ctx.arc(hx, hy, ui.joy.r * 0.44, 0, TAU);
    ctx.fillStyle = ui.joy.active ? 'rgba(255,220,110,0.55)' : 'rgba(255,220,110,0.3)';
    ctx.fill();

  }

  function drawStateText() {
    if (G.mode === 'cleared') {
      var a = Math.min(1, G.timer);
      txtShadow('过关！', W * 0.5, H * 0.42, fs(30), 'rgba(255,235,140,' + a + ')', 'center', 700);
      txtShadow('下一关：' + Math.min(MAX_LEVEL, G.level + 1), W * 0.5, H * 0.42 + 34, fs(15), 'rgba(190,220,255,' + a + ')', 'center', 500);
    } else if (G.mode === 'failed') {
      var a2 = Math.min(1, G.timer);
      txtShadow(G.failText, W * 0.5, H * 0.42, fs(26), 'rgba(255,110,90,' + a2 + ')', 'center', 700);
      txtShadow('重开本关…', W * 0.5, H * 0.42 + 32, fs(14), 'rgba(255,200,150,' + a2 + ')', 'center', 500);
    } else if (G.mode === 'victory') {
      txtShadow('全部通关！', W * 0.5, H * 0.40, fs(30), '#ffe27a', 'center', 700);
      txtShadow('金币 ' + G.gold + ' · 用时 ' + fmtTime(G.totalTime), W * 0.5, H * 0.40 + 34, fs(14), '#9fc4ff', 'center', 500);
      txtShadow('点这里再从第 1 关开始', W * 0.5, H * 0.40 + 64, fs(13), 'rgba(200,220,255,0.8)', 'center', 500);
    }
  }

  // ===================== 主循环 =====================
  var lastTime = 0;

  function loop(now) {
    var dt = (now - lastTime) / 1000;
    if (!lastTime || dt > 0.1) dt = 0.016;
    if (dt < 0) dt = 0.016;
    lastTime = now;
    t += dt;

    if (G.mode === 'menu') {
      scale = Math.min(W, H) / (24);
    } else {
      update(dt);
    }

    render();
    requestAnimationFrame(loop);
  }

  // ===================== 开始 / 菜单 =====================
  function beginGame() {
    initAudio();
    var name = nameEl.value.trim();
    if (!name) {
      nameEl.focus();
      nameEl.style.borderColor = 'rgba(255,90,70,0.9)';
      return;
    }
    name = name.replace(/[^0-9a-zA-Z_\u4e00-\u9fa5]/g, '').slice(0, 16);
    if (!name) return;
    var all = loadAll();
    var rec = all[name];
    G.name = name;
    G.gold = rec ? rec.gold : 0;
    G.totalTime = rec ? rec.time : 0;
    G.level = rec ? Math.max(1, Math.min(MAX_LEVEL, rec.level)) : 1;

    menuEl.classList.add('hide');
    startLevel(G.level, true);
    sfx.start();
  }

  startBtn.addEventListener('click', beginGame);
  nameEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') beginGame();
    else sfx.input();
  });

  // 点击胜利画面重开
  cv.addEventListener('click', function () {
    if (G.mode === 'victory') {
      G.level = 1;
      G.gold = 0;
      startLevel(1, true);
    }
  });

  window.addEventListener('beforeunload', function () {
    if (G.mode !== 'menu') savePlayer();
  });
  window.addEventListener('visibilitychange', function () {
    if (document.hidden && G.mode === 'playing') savePlayer();
  });

  // ===================== 启动 =====================
  resize();
  renderScoreList();
  nameEl.focus();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
